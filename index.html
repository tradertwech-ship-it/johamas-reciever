<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johamas Online - Major Order Receiver & Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono-custom { font-family: 'Space Mono', monospace; } </style>
</head>
<body class="min-h-screen bg-[#F6EEDD] pb-24 text-[#24170F]">
  <header class="bg-[#1F4B33] text-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between p-4">
      <div class="flex items-center gap-2">
        <i data-lucide="radio" class="h-6 w-6 text-[#E8A93D]"></i>
        <div>
          <h1 class="text-xs font-bold uppercase tracking-wider text-[#E8A93D]">Johamas Network</h1>
          <span class="text-lg font-extrabold tracking-tight">Major Order Receiver</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/20 px-3 py-1 text-xs font-bold text-emerald-300">
          <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Routing Hub
        </span>
      </div>
    </div>
    <div class="h-2 w-full rounded-full" style="background-image: repeating-linear-gradient(115deg, #1F4B33 0 22px, #C1502E 22px 44px, #E8A93D 44px 66px, #24170F 66px 88px);"></div>
  </header>

  <main class="mx-auto max-w-5xl p-4 space-y-6">
    <!-- METRICS SUMMARY CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <div class="rounded-2xl border bg-white p-4 shadow-sm">
        <p class="text-xs font-bold text-[#8A7A63] uppercase">Total Orders Routed</p>
        <p id="metric-total-orders" class="font-mono text-2xl font-extrabold text-[#1F4B33] mt-1">0</p>
      </div>
      <div class="rounded-2xl border bg-white p-4 shadow-sm">
        <p class="text-xs font-bold text-[#8A7A63] uppercase">Confirmed Orders</p>
        <p id="metric-confirmed-orders" class="font-mono text-2xl font-extrabold text-emerald-600 mt-1">0</p>
      </div>
      <div class="rounded-2xl border bg-white p-4 shadow-sm">
        <p class="text-xs font-bold text-[#8A7A63] uppercase">Total Volume Value</p>
        <p id="metric-total-revenue" class="font-mono text-2xl font-extrabold text-[#C1502E] mt-1">UGX 0</p>
      </div>
      <div class="rounded-2xl border bg-white p-4 shadow-sm">
        <p class="text-xs font-bold text-[#8A7A63] uppercase">Active Minor Nodes</p>
        <p id="metric-active-nodes" class="font-mono text-2xl font-extrabold text-[#24170F] mt-1">3</p>
      </div>
    </div>

    <!-- DAILY MARKETING & VOLUME BREAKDOWN -->
    <div class="rounded-2xl border bg-white p-6 shadow-sm">
      <h2 class="text-sm font-bold text-[#24170F] mb-4 flex items-center gap-2">
        <i data-lucide="bar-chart-3" class="h-4 w-4 text-[#C1502E]"></i> Daily Marketing Volume Breakdown
      </h2>
      <div id="volume-chart-container" class="space-y-3">
        <!-- Chronological breakdown -->
      </div>
    </div>

    <!-- ORDERS GROUPED BY MINOR RECEIVER NODES -->
    <div class="rounded-2xl border bg-white p-6 shadow-sm">
      <h2 class="text-sm font-bold text-[#24170F] mb-4 flex items-center gap-2">
        <i data-lucide="layers" class="h-4 w-4 text-[#1F4B33]"></i> Dispersed Orders by Minor Receiver Node
      </h2>
      <div id="node-groups-container" class="space-y-6">
        <p class="text-xs text-center text-[#8A7A63] py-8">Loading receiver node streams...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://arndidkfyuozpwsxvdko.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_fJAa7l45sUbavx2PxNhTZA_FLPohiaa";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadMajorReceiverData() {
      const [{ data: orders, error }, { data: receivers }] = await Promise.all([
        sb.from("orders").select("*, minor_receivers(id, name)").order("created_at", { ascending: false }),
        sb.from("minor_receivers").select("id, name")
      ]);
      
      if(error || !orders) {
        document.getElementById("node-groups-container").innerHTML = `<p class="text-xs text-center text-red-500 py-4">Failed to load order queue.</p>`;
        return;
      }

      const totalOrders = orders.length;
      const confirmedOrders = orders.filter(o => o.status === 'confirmed').length;
      const totalRevenue = orders.reduce((sum, o) => sum + Number(o.total || 0), 0);
      
      document.getElementById("metric-total-orders").textContent = totalOrders;
      document.getElementById("metric-confirmed-orders").textContent = confirmedOrders;
      document.getElementById("metric-total-revenue").textContent = "UGX " + totalRevenue.toLocaleString();
      document.getElementById("metric-active-nodes").textContent = receivers ? receivers.length : 3;

      // Daily volume breakdown
      const dailyMap = {};
      orders.forEach(o => {
        const dateStr = new Date(o.created_at).toLocaleDateString();
        if(!dailyMap[dateStr]) dailyMap[dateStr] = { count: 0, revenue: 0 };
        dailyMap[dateStr].count++;
        dailyMap[dateStr].revenue += Number(o.total || 0);
      });

      const chartContainer = document.getElementById("volume-chart-container");
      const dates = Object.keys(dailyMap).sort((a,b) => new Date(b) - new Date(a));
      
      if(dates.length === 0) {
        chartContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">No chronological marketing data recorded yet.</p>`;
      } else {
        chartContainer.innerHTML = dates.map(date => {
          const stats = dailyMap[date];
          return `
            <div class="flex items-center justify-between p-3 rounded-xl bg-[#F6EEDD]/50 border">
              <div>
                <span class="font-bold text-xs text-[#24170F]">${date}</span>
                <span class="text-[10px] text-[#8A7A63] block">${stats.count} pack order(s) dispersed</span>
              </div>
              <span class="font-mono text-xs font-bold text-[#C1502E]">UGX ${stats.revenue.toLocaleString()}</span>
            </div>
          `;
        }).join("");
      }

      // Group Orders by Minor Receiver Node
      const container = document.getElementById("node-groups-container");
      if(receivers && receivers.length > 0) {
        container.innerHTML = receivers.map(node => {
          const nodeOrders = orders.filter(o => o.minor_receiver_id === node.id);
          const nodeConfirmedCount = nodeOrders.filter(o => o.status === 'confirmed').length;

          return `
            <div class="rounded-xl border bg-[#F6EEDD]/20 p-4 space-y-3">
              <div class="flex items-center justify-between border-b pb-2">
                <div>
                  <h3 class="font-bold text-sm text-[#1F4B33]">${node.name}</h3>
                  <p class="text-[10px] text-[#8A7A63]">Node Routing ID: ${node.id.slice(0,8)}... • <span class="font-bold text-emerald-700">${nodeConfirmedCount} confirmed order(s)</span></p>
                </div>
                <span class="rounded-full bg-[#1F4B33]/10 px-2.5 py-1 text-xs font-bold font-mono text-[#1F4B33]">${nodeOrders.length} Total</span>
              </div>
              <div class="space-y-2">
                ${nodeOrders.length === 0 ? `<p class="text-xs text-gray-400 py-2 italic text-center">No orders dispersed to this node yet.</p>` : nodeOrders.map(o => {
                  const isConfirmed = o.status === 'confirmed';
                  const badgeClass = isConfirmed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
                  return `
                    <div class="p-3 rounded-lg border bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-mono text-xs font-bold text-[#C1502E]">#${o.id.slice(0,8)}</span>
                          <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase ${badgeClass}">${o.status || 'Dispersed'}</span>
                        </div>
                        <p class="text-xs text-[#24170F] mt-1">Buyer Contact: <span class="font-mono font-bold">${o.contact}</span></p>
                      </div>
                      <div class="text-right">
                        <span class="font-mono text-xs font-extrabold text-[#1F4B33] block">UGX ${Number(o.total).toLocaleString()}</span>
                        <span class="text-[10px] text-[#8A7A63]">${new Date(o.created_at).toLocaleTimeString()}</span>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        }).join("");
      } else {
        container.innerHTML = `<p class="text-xs text-center text-[#8A7A63] py-8">No minor receiver nodes found in network.</p>`;
      }

      lucide.createIcons();
    }

    setInterval(loadMajorReceiverData, 5000);
    loadMajorReceiverData();
  </script>
</body>
</html>
